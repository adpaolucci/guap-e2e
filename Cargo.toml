[workspace]
resolver = "2"
members = ["crates/e2e-fixtures", "crates/e2e-tiers", "crates/e2e-r4", "crates/e2e-runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
e2e-fixtures = { path = "crates/e2e-fixtures" }
e2e-tiers = { path = "crates/e2e-tiers" }
e2e-r4 = { path = "crates/e2e-r4" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.34", features = ["bundled"] }
crc32fast = "1.5"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
tempfile = "3.27"
walkdir = "2.5"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
byteorder = "1.5"
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "3.0.10", default-features = false, features = ["parsing", "full", "visit"] }
toml = "1.2"